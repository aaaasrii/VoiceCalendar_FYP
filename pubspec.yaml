name: voca_assist
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_generative_ai: ^0.4.7
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.5
  record: ^5.2.0
  path_provider: ^2.1.2
  firebase_core: ^4.7.0
  cloud_firestore: ^6.3.0
  speech_to_text: ^6.6.2
  intl: ^0.20.2
  firebase_ai: ^3.11.0
  firebase_app_check: ^0.4.3
  add_2_calendar: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # If you add images later, they go here:
  # assets:
  #   - assets/images/
# Add this at the very bottom of your pubspec.yaml
dependency_overrides:
  record_linux: ^1.3.0
  record_platform_interface: ^1.5.0